name: fetch-carousel-images

on:
  push:
    branches: [claude/project-thread-yeilj5]
    paths: [scripts/carousel-images.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p tmp-carousel-raw
          while read -r slug url; do
            [ -z "$slug" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "tmp-carousel-raw/$slug" "$url" || echo "FAILED $slug"
            sleep 1
          done < scripts/carousel-images.txt
          ls -la tmp-carousel-raw
      - name: Commit
        run: |
          git config user.name "carousel-images bot"
          git config user.email "actions@github.com"
          git add tmp-carousel-raw
          git commit -m "Add raw photos for new Vinted items"
          git push
